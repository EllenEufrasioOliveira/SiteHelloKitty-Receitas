<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receitas Hello Kitty</title>
    <link rel="stylesheet" href="recursos/css/footer.css">
    <link rel="stylesheet" href="recursos/css/header.css">
    <link rel="stylesheet" href="recursos/css/index.css">
</head>
<body>
    <!-- HEADER -->
    <header>
        <div class="logo">
            <img src="recursos/imagens/logo.png" alt="Hello Kitty">
        </div>
        <nav>
            <ul>
                <li><a href="#">RECEITAS</a></li>
                <li><a href="#">GALERIA</a></li>
                <li><a href="sobre.html">SOBRE NÓS</a></li>
            </ul>
        </nav>

        <div class="search-box">
            <input type="text" placeholder="Pesquisar...">
            <button>🔍</button>
        </div>

    </header>


    <!-- DESTAQUES -->
    <section class="destaques">
        <h2>Destaques da Semana</h2>
        <div class="cards">
            <div class="card">
                <img src="imagens/biscoitos.jpg" alt="Biscoitos">
                <p>Biscoitos</p>
                <span>⏱ 45 min</span>
            </div>
            <div class="card">
                <img src="imagens/cupcake.jpg" alt="Cupcake">
                <p>Cupcake</p>
                <span>⏱ 45 min</span>
            </div>
            <div class="card">
                <img src="imagens/prato.jpg" alt="Prato Divertido">
                <p>Prato Divertido</p>
                <span>⏱ 45 min</span>
            </div>
            <div class="card">
                <img src="imagens/bolo.jpg" alt="Bolo de Morango">
                <p>Bolo de Morango</p>
                <span>⏱ 45 min</span>
            </div>
            <div class="card">
                <img src="imagens/panqueca.jpg" alt="Panquecas">
                <p>Panquecas</p>
                <span>⏱ 45 min</span>
            </div>
        </div>
    </section>

    <!-- FORMULÁRIO -->
    <section class="contato">
        <h2>Entre em Contato</h2>
        <form>
            <input type="text" placeholder="Nome" required>
            <input type="email" placeholder="E-mail" required>
            <button type="submit">ENVIAR</button>
        </form>
    </section>

    <!-- FOOTER -->
    <footer>
        <p>© 2025 Cozinhando com Hello Kitty. Todos os direitos reservados.</p>
        <img src="recursos/imagens/footerhellokitty.png" alt="Hello Kitty">
    </footer>
</body>
</html>
